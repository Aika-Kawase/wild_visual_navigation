robot:
  # length: 0.8
  # width: 0.6
  # height: 0.4
  # radius: 0.1
  mass: 50.0
  center_of_mass: [0.0, 0.0, -0.1]
  
imu:
  noise_density_accel: 0.001
  noise_density_gyro: 0.005
  bias_stability: 0.0001     # anteisei
  position_in_robot_frame: [0.0, 0.0, 0.0]
  orientation_in_robot_frame: [0.0, 0.0, 0.0]

drivetrain:
  motor_torque_constant: 0.1
  gear_ratio: 10.0           # gear hiritu
  efficiency: 0.95           # dentautu efficiency
  tire_stiffness: 1.0             # gousei
  friction_coefficient: 0.7           # tire's
  motor_response_time: 0.1
  damping_factor: 0.6

controller:
  bandwidth: 5.0             # controller's gain setting