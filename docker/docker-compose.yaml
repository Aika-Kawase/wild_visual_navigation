services:
  wvn:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    stdin_open: true
    tty: true
#    network_mode: "host"
    dns:
      - 133.26.136.30
    volumes:
      - ../../wild_visual_navigation:/root/catkin_ws/src/wild_visual_navigation
      - ../../self_supervised_segmentation:/root/catkin_ws/src/self_supervised_segmentation
    environment:
      - ROS_MASTER_URI=http://ros1-wvn:11311
      - ROS_HOSTNAME=ros1-wvn
    command: "/bin/bash"
